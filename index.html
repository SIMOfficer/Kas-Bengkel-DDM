<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1f24">
<title>Kas Bengkel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#1c1f24; --muted:#6b7280; --line:#e5e7eb;
  --dark:#1c1f24; --accent:#c8102e; --accent-ink:#fff;
  --in:#0f8a4b; --in-bg:#e7f6ee; --out:#c8102e; --out-bg:#fdecee;
  --warn-bg:#fff7e6; --warn:#9a6700; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#1c1f24 0%,#2b2f36 55%,#3a1016 100%)}
.login-box{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand h1{margin:0;font-size:20px}
.brand p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.err{color:var(--out);font-size:13px;min-height:18px;margin:10px 0 0}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--dark);color:#fff}
.btn.danger{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:18px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- App shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top .title{font-weight:800;font-size:17px}
.top .sub{font-size:12px;opacity:.75}
.top-act{display:flex;gap:6px;position:relative}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
.menu{position:absolute;right:0;top:46px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:190px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:none;cursor:pointer}
.menu button:hover{background:var(--bg)}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}

.saldo-card{background:var(--dark);color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden}
.saldo-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.25}
.saldo-card .lbl{font-size:13px;opacity:.8}
.saldo-card .saldo{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0}
.saldo-card .upd{font-size:12px;opacity:.6}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px;align-items:center}
.toolbar input[type=month]{width:auto;flex:0 0 auto;padding:9px 10px}
.toolbar input[type=search]{flex:1 1 160px;padding:9px 12px}
.seg{display:inline-flex;background:#e5e7eb;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.summary{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:800;font-size:16px;margin-top:2px;word-break:break-word}
.stat.in .v{color:var(--in)} .stat.out .v{color:var(--out)}

.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px 16px;margin-top:14px}
.card h3,.sec-title{margin:0 0 10px;font-size:14px}
.sec-title{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-weight:500;color:var(--muted)}
.bar-row{margin:8px 0}
.bar-top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar-top span:last-child{font-weight:700;white-space:nowrap}
.bar{height:7px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}

.day{font-size:12px;font-weight:700;color:var(--muted);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.4px}
.trx{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.trx-ic{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px}
.trx-ic.in{background:var(--in-bg);color:var(--in)} .trx-ic.out{background:var(--out-bg);color:var(--out)}
.trx-main{flex:1;min-width:0}
.trx-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.trx-kat{font-weight:700;font-size:14px}
.amt{font-weight:800;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.trx-ket{font-size:14px;margin-top:2px;word-break:break-word}
.trx-meta{font-size:12px;color:var(--muted);margin-top:3px}
.trx-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:13px}
.trx-foot a{color:var(--ink);font-weight:700}
.trx-foot .run{color:var(--muted);margin-left:auto}
.link-btn{border:0;background:none;padding:0;color:var(--out);font-weight:700;cursor:pointer;font-size:13px}
.trx.void{opacity:.65}
.trx.void .amt,.trx.void .trx-kat{text-decoration:line-through}
.void-note{margin-top:8px;background:var(--warn-bg);color:var(--warn);font-size:12px;padding:6px 10px;border-radius:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;padding:15px 20px;box-shadow:0 10px 25px rgba(200,16,46,.4);cursor:pointer}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,17,20,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:620px){.sheet{border-radius:20px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-head h2{margin:0;font-size:18px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.type-toggle button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.type-toggle button.on.out{border-color:var(--out);background:var(--out-bg);color:var(--out)}
.type-toggle button.on.in{border-color:var(--in);background:var(--in-bg);color:var(--in)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;margin-top:6px}
.drop strong{color:var(--ink)}
.drop input{display:none}
.preview{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px}
.preview img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.info-box{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}

/* ---------- Busy & toast ---------- */
.busy{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--out)} #toast.ok{background:var(--in)}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="hidden">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">KB</div>
      <div><h1>Kas Bengkel</h1><p>Pencatatan & monitoring kas bengkel</p></div>
    </div>
    <label for="lgNama">Nama</label>
    <select id="lgNama"><option>Memuat…</option></select>
    <label for="lgPin">PIN</label>
    <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="••••••">
    <button id="lgBtn" class="btn primary block">Masuk</button>
    <p id="lgErr" class="err"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top">
    <div>
      <div class="title">Kas Bengkel</div>
      <div class="sub" id="who"></div>
    </div>
    <div class="top-act">
      <button class="icon-btn" id="btnRefresh" title="Muat ulang" aria-label="Muat ulang">⟳</button>
      <button class="icon-btn" id="btnMenu" title="Menu" aria-label="Menu">⋮</button>
      <div class="menu hidden" id="menu">
        <button data-act="csv">Export CSV bulan ini</button>
        <button data-act="pin">Ganti PIN</button>
        <button data-act="logout">Keluar</button>
      </div>
    </div>
  </header>

  <main>
    <section class="saldo-card">
      <div class="lbl">Saldo kas saat ini</div>
      <div class="saldo" id="saldo">Rp 0</div>
      <div class="upd" id="upd"></div>
    </section>

    <section class="toolbar">
      <input type="month" id="fMonth" aria-label="Bulan">
      <div class="seg" id="fType">
        <button data-v="ALL" class="on">Semua</button>
        <button data-v="MASUK">Masuk</button>
        <button data-v="KELUAR">Keluar</button>
      </div>
      <input type="search" id="fQ" placeholder="Cari keterangan, ID, teknisi…">
    </section>

    <section class="summary" id="summary"></section>

    <section class="card" id="bdCard">
      <h3>Pengeluaran per kategori</h3>
      <div id="breakdown"></div>
    </section>

    <h3 class="sec-title">Transaksi <small id="cnt"></small></h3>
    <div id="list"></div>
  </main>

  <button class="fab hidden" id="fab">+ Catat Transaksi</button>
</div>

<!-- ================= MODAL: TAMBAH ================= -->
<div class="modal hidden" id="mdlTrx">
  <div class="sheet">
    <div class="sheet-head"><h2>Catat Transaksi</h2><button class="x" data-close>×</button></div>
    <div class="type-toggle" id="tType">
      <button data-v="KELUAR" class="out on">↑ Pengeluaran</button>
      <button data-v="MASUK" class="in">↓ Pemasukan</button>
    </div>
    <div class="row2">
      <div><label for="tTgl">Tanggal</label><input type="date" id="tTgl"></div>
      <div><label for="tNom">Nominal (Rp)</label><input id="tNom" inputmode="numeric" placeholder="0"></div>
    </div>
    <label for="tKat">Kategori</label>
    <select id="tKat"></select>
    <label for="tKet">Keterangan</label>
    <textarea id="tKet" placeholder="Contoh: Beli seal oli pengganti yang rusak saat bongkar"></textarea>
    <div id="tTerkaitWrap">
      <label for="tTerkait">Teknisi / No. WO terkait <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <input id="tTerkait" placeholder="Contoh: Andi — WO 12345">
    </div>
    <label id="tFileLbl">Bukti / nota</label>
    <label class="drop" id="drop">
      <input type="file" id="tFile" accept="image/*,application/pdf">
      <strong>Ambil foto atau pilih file</strong><br>JPG, PNG, atau PDF
    </label>
    <div class="preview hidden" id="tPrev"></div>
    <div class="info-box" id="tInfo"></div>
    <button class="btn danger block" id="tSave">Simpan Transaksi</button>
  </div>
</div>

<!-- ================= MODAL: BATAL ================= -->
<div class="modal hidden" id="mdlCancel">
  <div class="sheet">
    <div class="sheet-head"><h2>Batalkan Transaksi</h2><button class="x" data-close>×</button></div>
    <div class="info-box" id="cInfo"></div>
    <p class="hint">Transaksi tidak dihapus, hanya ditandai batal dan tidak dihitung ke saldo. Riwayatnya tetap terlihat oleh team.</p>
    <label for="cAlasan">Alasan pembatalan</label>
    <textarea id="cAlasan" placeholder="Contoh: Salah input nominal, sudah dicatat ulang di K-2611-004"></textarea>
    <button class="btn danger block" id="cSave">Batalkan Transaksi</button>
  </div>
</div>

<!-- ================= MODAL: PIN ================= -->
<div class="modal hidden" id="mdlPin">
  <div class="sheet">
    <div class="sheet-head"><h2>Ganti PIN</h2><button class="x" data-close>×</button></div>
    <label for="pLama">PIN lama</label><input id="pLama" type="password" inputmode="numeric" maxlength="8">
    <label for="pBaru">PIN baru (4–8 digit)</label><input id="pBaru" type="password" inputmode="numeric" maxlength="8">
    <label for="pBaru2">Ulangi PIN baru</label><input id="pBaru2" type="password" inputmode="numeric" maxlength="8">
    <button class="btn primary block" id="pSave">Simpan PIN</button>
  </div>
</div>

<div class="busy hidden" id="busy"><div class="spin"></div><div id="busyTxt">Memuat…</div></div>
<div id="toast"></div>

<script>
/* =========================================================
   KONFIGURASI — tempel URL Web App Apps Script di sini
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzV36cYl-F2pOk2nQv0UiTYf2smXgwOL8S5ktu37qprwHuR5Pyt401kx55dt2pRkr4Viw/exec';
const MAKS_MB = 8;

/* ---------- Helper ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const nf = new Intl.NumberFormat('id-ID');
const rp = n => 'Rp ' + nf.format(Math.round(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTgl(s){ const [y,m,d] = s.split('-').map(Number); return `${d} ${BULAN[m-1].slice(0,3)} ${y}`; }
function fmtHari(s){ const [y,m,d] = s.split('-').map(Number); const dt = new Date(y,m-1,d); return `${HARI[dt.getDay()]}, ${d} ${BULAN[m-1]} ${y}`; }
function labelBulan(ym){ const [y,m] = ym.split('-').map(Number); return `${BULAN[m-1]} ${y}`; }

const state = {
  token: store.get('kb_token'), user: null, trx: [], saldo: 0,
  kategori: { MASUK: [], KELUAR: [] }, month: today().slice(0,7),
  filter: 'ALL', q: '', jenis: 'KELUAR', file: null, cancelId: null, loadedAt: null
};

/* ---------- UI util ---------- */
function busy(on, txt){ $('#busyTxt').textContent = txt || 'Memuat…'; $('#busy').classList.toggle('hidden', !on); }
let toastT;
function toast(msg, type){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3500);
}
function openModal(id){ $(id).classList.remove('hidden'); }
function closeModal(el){ (el.closest ? el.closest('.modal') : $(el)).classList.add('hidden'); }
$$('[data-close]').forEach(b => b.onclick = () => closeModal(b));
$$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m); }));

/* ---------- API ---------- */
async function api(action, payload = {}){
  let res;
  try {
    // Tanpa header Content-Type agar tidak memicu preflight CORS
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: state.token, ...payload }) });
  } catch(e){ throw new Error('Gagal terhubung ke server. Periksa koneksi internet.'); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('Respon server tidak valid. Periksa API_URL & deployment.'); }
  if (!j.ok){
    if (j.error === 'SESI_HABIS'){
      state.token = null; store.del('kb_token');
      const err = new Error('Sesi habis, silakan masuk lagi'); err.expired = true; throw err;
    }
    throw new Error(j.error || 'Terjadi kesalahan');
  }
  return j;
}
function handleErr(e){ toast(e.message, 'err'); if (e.expired) showLogin(); }

/* ---------- Login ---------- */
async function showLogin(){
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $$('.modal').forEach(m => m.classList.add('hidden'));
  if (API_URL.startsWith('PASTE')){ $('#lgErr').textContent = 'API_URL belum diisi di index.html'; return; }
  try {
    const r = await api('users');
    $('#lgNama').innerHTML = r.users.map(n => `<option>${esc(n)}</option>`).join('') || '<option value="">Belum ada pengguna</option>';
    const last = store.get('kb_nama');
    if (last && r.users.includes(last)) $('#lgNama').value = last;
  } catch(e){ $('#lgErr').textContent = 'Gagal memuat pengguna: ' + e.message; }
}
async function doLogin(){
  const nama = $('#lgNama').value, pin = $('#lgPin').value.trim();
  if (!pin){ $('#lgPin').focus(); return; }
  $('#lgErr').textContent = ''; busy(true, 'Masuk…');
  try {
    const r = await api('login', { nama, pin });
    state.token = r.token; store.set('kb_token', r.token); store.set('kb_nama', nama);
    $('#lgPin').value = '';
    await loadData(); showApp();
  } catch(e){ $('#lgErr').textContent = e.message; }
  finally { busy(false); }
}
$('#lgBtn').onclick = doLogin;
$('#lgPin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function logout(){ state.token = null; store.del('kb_token'); showLogin(); }

/* ---------- Data ---------- */
async function loadData(){
  const r = await api('data');
  state.user = r.user; state.saldo = r.saldo; state.kategori = r.kategori;
  state.trx = r.transaksi.sort((a,b) => a.tanggal.localeCompare(b.tanggal) || a.waktuInput.localeCompare(b.waktuInput));
  let run = 0;
  state.trx.forEach(t => { if (t.status === 'AKTIF') run += t.jenis === 'MASUK' ? t.nominal : -t.nominal; t.saldoSetelah = run; });
  state.loadedAt = new Date();
}
async function refresh(silent){
  if (!silent) busy(true, 'Memuat data…');
  try { await loadData(); render(); if (!silent) toast('Data diperbarui'); }
  catch(e){ handleErr(e); }
  finally { busy(false); }
}

function isKabeng(){ return state.user && state.user.role === 'KABENG'; }

function showApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = `${state.user.nama} · ${isKabeng() ? 'Kepala Bengkel (pemegang kas)' : 'Team — mode lihat'}`;
  $('#fab').classList.toggle('hidden', !isKabeng());
  $('#fMonth').value = state.month;
  render();
}

/* ---------- Render ---------- */
function render(){
  $('#saldo').textContent = rp(state.saldo);
  $('#upd').textContent = 'Diperbarui ' + state.loadedAt.toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

  const m = state.month;
  const awal = state.trx.filter(t => t.status === 'AKTIF' && t.tanggal.slice(0,7) < m)
    .reduce((s,t) => s + (t.jenis === 'MASUK' ? t.nominal : -t.nominal), 0);
  const bulan = state.trx.filter(t => t.tanggal.slice(0,7) === m);
  const aktif = bulan.filter(t => t.status === 'AKTIF');
  const masuk = aktif.filter(t => t.jenis === 'MASUK').reduce((s,t) => s + t.nominal, 0);
  const keluar = aktif.filter(t => t.jenis === 'KELUAR').reduce((s,t) => s + t.nominal, 0);

  $('#summary').innerHTML = `
    <div class="stat"><div class="k">Saldo awal ${esc(BULAN[+m.slice(5)-1].slice(0,3))}</div><div class="v">${rp(awal)}</div></div>
    <div class="stat in"><div class="k">Pemasukan</div><div class="v">+${rp(masuk)}</div></div>
    <div class="stat out"><div class="k">Pengeluaran</div><div class="v">−${rp(keluar)}</div></div>
    <div class="stat"><div class="k">Saldo akhir ${esc(BULAN[+m.slice(5)-1].slice(0,3))}</div><div class="v">${rp(awal + masuk - keluar)}</div></div>`;

  // Rincian pengeluaran per kategori
  const grp = {};
  aktif.filter(t => t.jenis === 'KELUAR').forEach(t => grp[t.kategori] = (grp[t.kategori] || 0) + t.nominal);
  const ent = Object.entries(grp).sort((a,b) => b[1] - a[1]);
  $('#breakdown').innerHTML = ent.length ? ent.map(([k,v]) => `
    <div class="bar-row">
      <div class="bar-top"><span>${esc(k)}</span><span>${rp(v)}</span></div>
      <div class="bar"><i style="width:${Math.max(3, v / keluar * 100).toFixed(1)}%"></i></div>
    </div>`).join('') : `<div class="empty">Belum ada pengeluaran di ${esc(labelBulan(m))}</div>`;

  // Daftar transaksi
  const q = state.q.toLowerCase();
  const list = bulan.filter(t => state.filter === 'ALL' || t.jenis === state.filter)
    .filter(t => !q || [t.id, t.kategori, t.keterangan, t.terkait, t.oleh].join(' ').toLowerCase().includes(q))
    .slice().reverse();
  $('#cnt').textContent = list.length ? `${list.length} transaksi` : '';

  if (!list.length){
    $('#list').innerHTML = `<div class="empty">Tidak ada transaksi di ${esc(labelBulan(m))}${q ? ' yang cocok dengan pencarian' : ''}.</div>`;
    return;
  }
  let lastDay = '', html = '';
  list.forEach(t => {
    if (t.tanggal !== lastDay){ html += `<div class="day">${esc(fmtHari(t.tanggal))}</div>`; lastDay = t.tanggal; }
    const isIn = t.jenis === 'MASUK', cls = isIn ? 'in' : 'out', aktifT = t.status === 'AKTIF';
    html += `
    <article class="trx ${aktifT ? '' : 'void'}">
      <div class="trx-ic ${cls}">${isIn ? '+' : '−'}</div>
      <div class="trx-main">
        <div class="trx-top">
          <span class="trx-kat">${esc(t.kategori)}</span>
          <span class="amt ${cls}">${isIn ? '+' : '−'}${rp(t.nominal)}</span>
        </div>
        <div class="trx-ket">${esc(t.keterangan)}</div>
        ${t.terkait ? `<div class="trx-meta">Terkait: ${esc(t.terkait)}</div>` : ''}
        <div class="trx-meta"><span class="badge">${esc(t.id)}</span> · dicatat ${esc(t.oleh)} · ${esc(t.waktuInput.slice(11,16))}</div>
        <div class="trx-foot">
          ${t.buktiUrl ? `<a href="${esc(t.buktiUrl)}" target="_blank" rel="noopener">Lihat ${isIn ? 'bukti transfer' : 'nota'} ↗</a>` : '<span class="trx-meta">Tanpa bukti</span>'}
          ${isKabeng() && aktifT ? `<button class="link-btn" data-cancel="${esc(t.id)}">Batalkan</button>` : ''}
          ${aktifT ? `<span class="run">Saldo: ${rp(t.saldoSetelah)}</span>` : '<span class="run">Tidak dihitung</span>'}
        </div>
        ${!aktifT ? `<div class="void-note">Dibatalkan oleh ${esc(t.batalOleh)} (${esc(t.waktuBatal.slice(0,16))}): ${esc(t.alasanBatal)}</div>` : ''}
      </div>
    </article>`;
  });
  $('#list').innerHTML = html;
  $$('[data-cancel]').forEach(b => b.onclick = () => openCancel(b.dataset.cancel));
}

/* ---------- Filter ---------- */
$('#fMonth').onchange = e => { state.month = e.target.value || today().slice(0,7); render(); };
$$('#fType button').forEach(b => b.onclick = () => {
  $$('#fType button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  state.filter = b.dataset.v; render();
});
let qT; $('#fQ').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 200); };

/* ---------- Menu ---------- */
$('#btnRefresh').onclick = () => refresh();
$('#btnMenu').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); };
document.addEventListener('click', () => $('#menu').classList.add('hidden'));
$$('#menu button').forEach(b => b.onclick = () => {
  const a = b.dataset.act;
  if (a === 'logout') logout();
  if (a === 'csv') exportCsv();
  if (a === 'pin'){ ['#pLama','#pBaru','#pBaru2'].forEach(s => $(s).value = ''); openModal('#mdlPin'); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && state.loadedAt && Date.now() - state.loadedAt > 60000) refresh(true);
});

/* ---------- Tambah transaksi ---------- */
function setJenis(j){
  state.jenis = j;
  $$('#tType button').forEach(b => b.classList.toggle('on', b.dataset.v === j));
  $('#tKat').innerHTML = state.kategori[j].map(k => `<option>${esc(k)}</option>`).join('');
  $('#tTerkaitWrap').classList.toggle('hidden', j !== 'KELUAR');
  $('#tFileLbl').textContent = j === 'MASUK' ? 'Bukti transfer' : 'Nota / bukti pembelian';
  $('#tKet').placeholder = j === 'MASUK' ? 'Contoh: Penjualan aki bekas 5 pcs ke pengepul' : 'Contoh: Beli seal oli pengganti yang rusak saat bongkar';
  updInfo();
}
function updInfo(){
  const n = Number($('#tNom').value.replace(/\D/g,'')) || 0;
  const sisa = state.jenis === 'MASUK' ? state.saldo + n : state.saldo - n;
  $('#tInfo').innerHTML = `Saldo saat ini <b>${rp(state.saldo)}</b> → setelah transaksi <b style="color:${sisa < 0 ? 'var(--out)' : 'inherit'}">${rp(sisa)}</b>`
    + (sisa < 0 ? '<br><span style="color:var(--out)">Saldo tidak cukup. Jika Anda menalangi, catat dulu pemasukan "Talangan Kepala Bengkel".</span>' : '');
}
$$('#tType button').forEach(b => b.onclick = () => setJenis(b.dataset.v));
$('#tNom').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g,'').replace(/^0+/,'');
  e.target.value = d ? nf.format(Number(d)) : '';
  updInfo();
});
$('#fab').onclick = () => {
  state.file = null;
  $('#tTgl').value = today(); $('#tTgl').max = today();
  ['#tNom','#tKet','#tTerkait'].forEach(s => $(s).value = '');
  $('#tFile').value = ''; $('#tPrev').classList.add('hidden');
  setJenis('KELUAR'); openModal('#mdlTrx');
};
$('#tFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  state.file = f;
  const p = $('#tPrev'); p.classList.remove('hidden');
  if (f.type.startsWith('image/')){
    const u = URL.createObjectURL(f);
    p.innerHTML = `<img src="${u}" alt=""><div>${esc(f.name)}<br><span class="hint">${(f.size/1024/1024).toFixed(2)} MB — akan dikompres</span></div>`;
  } else {
    p.innerHTML = `<div class="trx-ic out">PDF</div><div>${esc(f.name)}<br><span class="hint">${(f.size/1024/1024).toFixed(2)} MB</span></div>`;
  }
};

function toB64(f){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
}
function compress(f, max = 1600, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    img.src = u;
  });
}
async function prepFile(f){
  if (f.type === 'application/pdf'){
    if (f.size > MAKS_MB*1024*1024) throw new Error(`PDF maksimal ${MAKS_MB} MB`);
    return { mime: f.type, data: await toB64(f) };
  }
  try { return { mime: 'image/jpeg', data: await compress(f) }; }
  catch(e){
    if (f.size > MAKS_MB*1024*1024) throw new Error(`File maksimal ${MAKS_MB} MB`);
    return { mime: f.type || 'image/jpeg', data: await toB64(f) };
  }
}

$('#tSave').onclick = async () => {
  const nominal = Number($('#tNom').value.replace(/\D/g,'')) || 0;
  const tanggal = $('#tTgl').value, kategori = $('#tKat').value;
  const keterangan = $('#tKet').value.trim(), terkait = state.jenis === 'KELUAR' ? $('#tTerkait').value.trim() : '';
  if (!tanggal) return toast('Tanggal wajib diisi', 'err');
  if (nominal <= 0) return toast('Nominal wajib diisi', 'err');
  if (keterangan.length < 3) return toast('Keterangan wajib diisi', 'err');
  if (!state.file) return toast(state.jenis === 'MASUK' ? 'Lampirkan bukti transfer' : 'Lampirkan nota / bukti', 'err');
  if (state.jenis === 'KELUAR' && nominal > state.saldo) return toast('Saldo kas tidak cukup', 'err');
  busy(true, 'Mengunggah bukti & menyimpan…');
  try {
    const file = await prepFile(state.file);
    const r = await api('add', { jenis: state.jenis, tanggal, kategori, nominal, keterangan, terkait, file });
    closeModal('#mdlTrx');
    state.month = tanggal.slice(0,7); $('#fMonth').value = state.month;
    await loadData(); render();
    toast(`Tersimpan: ${r.id}`, 'ok');
  } catch(e){ handleErr(e); }
  finally { busy(false); }
};

/* ---------- Batalkan ---------- */
function openCancel(id){
  const t = state.trx.find(x => x.id === id); if (!t) return;
  state.cancelId = id;
  $('#cInfo').innerHTML = `<b>${esc(t.id)}</b> · ${esc(fmtTgl(t.tanggal))}<br>${esc(t.kategori)} — ${esc(t.keterangan)}<br><b>${t.jenis === 'MASUK' ? '+' : '−'}${rp(t.nominal)}</b>`;
  $('#cAlasan').value = '';
  openModal('#mdlCancel');
}
$('#cSave').onclick = async () => {
  const alasan = $('#cAlasan').value.trim();
  if (alasan.length < 5) return toast('Tulis alasan pembatalan', 'err');
  busy(true, 'Membatalkan…');
  try {
    await api('cancel', { id: state.cancelId, alasan });
    closeModal('#mdlCancel'); await loadData(); render(); toast('Transaksi dibatalkan', 'ok');
  } catch(e){ handleErr(e); }
  finally { busy(false); }
};

/* ---------- Ganti PIN ---------- */
$('#pSave').onclick = async () => {
  const pinLama = $('#pLama').value.trim(), pinBaru = $('#pBaru').value.trim();
  if (!/^\d{4,8}$/.test(pinBaru)) return toast('PIN baru harus 4–8 digit angka', 'err');
  if (pinBaru !== $('#pBaru2').value.trim()) return toast('Konfirmasi PIN tidak sama', 'err');
  busy(true, 'Menyimpan PIN…');
  try { await api('changePin', { pinLama, pinBaru }); closeModal('#mdlPin'); toast('PIN berhasil diganti', 'ok'); }
  catch(e){ handleErr(e); }
  finally { busy(false); }
};

/* ---------- Export CSV ---------- */
function exportCsv(){
  const rows = state.trx.filter(t => t.tanggal.slice(0,7) === state.month);
  if (!rows.length) return toast('Tidak ada transaksi di bulan ini', 'err');
  const head = ['ID','Tanggal','Jenis','Kategori','Keterangan','Terkait','Nominal','Status','Saldo Setelah','Dicatat Oleh','Waktu Input','Bukti','Alasan Batal'];
  const data = rows.map(t => [t.id, t.tanggal, t.jenis, t.kategori, t.keterangan, t.terkait, t.nominal, t.status,
    t.status === 'AKTIF' ? t.saldoSetelah : '', t.oleh, t.waktuInput, t.buktiUrl, t.alasanBatal]);
  const csv = [head, ...data].map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `kas-bengkel-${state.month}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Start ---------- */
(async function init(){
  $('#fMonth').value = state.month;
  if (state.token && !API_URL.startsWith('PASTE')){
    busy(true, 'Memuat data…');
    try { await loadData(); busy(false); showApp(); return; }
    catch(e){ busy(false); }
  }
  showLogin();
})();
</script>
